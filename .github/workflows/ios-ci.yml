name: iOS CI y Screenshots

on:
  push:
    branches: [main]

jobs:
  build-and-screenshot:
    name: Compilar y Ejecutar Pruebas UI
    runs-on: macos-latest

    steps:
      - name: Código del repositorio
        uses: actions/checkout@v4

      - name: Configurar versión de Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Ejecutar pruebas UI y capturar pantallas
        run: |
          xcodebuild test \
          -scheme "Reto 3 - Sabias Que" \
          -destination "platform=iOS Simulator,name=iPhone 15" \
          -resultBundlePath TestResults.xcresult

      - name: Subir resultados y capturas como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-app
          path: TestResults.xcresult
