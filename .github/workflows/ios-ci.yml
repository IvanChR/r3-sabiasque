name: iOS CI y Screenshots

on:
  push:
    branches: [main]
  workflow_dispatch: # Permite ejecutar el workflow manualmente desde la pestaña Actions

jobs:
  build-and-screenshot:
    name: Compilar, Ejecutar UI Tests y Extraer Capturas
    runs-on: macos-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar versión de Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Instalar xcparse (Herramienta para extraer capturas)
        run: brew install chargepoint/xcparse/xcparse

      - name: Ejecutar pruebas UI en el Simulador
        run: |
          xcodebuild test \
            -scheme "Reto 3 - Sabias Que" \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            -resultBundlePath TestResults.xcresult

      - name: Extraer imágenes PNG del reporte .xcresult
        if: always()
        run: |
          mkdir -p Screenshots
          xcparse screenshots TestResults.xcresult Screenshots/

      - name: Subir capturas como artefacto ZIP
        uses: actions/upload-artifact@v4
        with:
          name: capturas-de-pantalla
          path: Screenshots/
